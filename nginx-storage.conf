# nginx config untuk VPS STORAGE (tempat quran-data.json disimpan)
# Letakkan di: /etc/nginx/sites-available/quran-storage
# Aktifkan: ln -s /etc/nginx/sites-available/quran-storage /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name storage.example.com;  # Ganti dengan domain/IP VPS storage kamu

    # Redirect ke HTTPS (aktifkan jika pakai SSL)
    # return 301 https://$host$request_uri;

    location / {
        root /var/www/quran-storage;   # Folder tempat quran-data.json
        autoindex off;

        # Izinkan akses dari mana saja (atau batasi ke IP VPS utama)
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=86400";  # Cache 24 jam di browser

        # Kompres JSON (hemat bandwidth ~70%)
        gzip on;
        gzip_types application/json;
        gzip_min_length 1000;
    }
}

